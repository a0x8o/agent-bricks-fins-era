# This is a Databricks asset bundle definition for agent-bricks-workshop.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: agent-bricks-workshop

include:
  - resources/era.yml

sync:
  # The generated corpus is gitignored (reproducible) but 00_tables_setup uploads
  # everything under data/, so ship it with the bundle.
  include:
    - data/edgar_10k/**
    - data/edgar_10q/**
    - data/synthetic/**
  # Local scratch that is untracked but not ignored.
  exclude:
    - archive/**
    - img/**
    - tmp/**

targets:
  dev:
    mode: development
    default: true
    # No workspace host: the CLI uses your profile (DATABRICKS_CONFIG_PROFILE),
    # so the bundle deploys to whichever workspace you're authenticated against.

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://<your-workspace>.cloud.databricks.com
