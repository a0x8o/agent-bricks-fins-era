bundle:
  name: meridian

variables:
  warehouse_id:
    description: SQL warehouse bound to the app
    default: "00a19186c27fa1de"
  genie_space_id:
    description: Genie space bound to the app (set after scripts/create_genie_space.py runs)
    default: ""

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: DEFAULT

resources:
  apps:
    meridian:
      name: meridian
      description: "Meridian — financial analysis workspace (charts + Genie)"
      source_code_path: ${workspace.root_path}/src
      config:
        command:
          - uvicorn
          - app.main:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
      user_api_scopes:
        - sql
        - dashboards.genie
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
