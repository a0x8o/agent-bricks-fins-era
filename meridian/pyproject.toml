[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/services/synthetic.py" = ["E501"]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["databricks.*", "httpx", "pandas", "numpy"]
ignore_missing_imports = true
