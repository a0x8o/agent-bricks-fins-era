command: ["npm", "run", "start"]
runtime: nodejs20

env:
  - name: DATABRICKS_SERVING_ENDPOINT
    value: "era-supervisor"

  # ── Pro mode (OPTIONAL) ──────────────────────────────────────────────────
  # APP_MODE toggles the richer experience. Defaults to "simple"; the pro
  # deploy notebook rewrites these values from config.py. Empty values keep
  # the corresponding pro feature disabled, so simple deploys are unaffected.
  - name: APP_MODE
    value: "pro"
  # SQL warehouse id used to read graphrag_* and ticker_data tables.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "2f2c504485282e9a"
  # Catalog/schema holding the graph + ticker tables.
  - name: GRAPH_CATALOG
    value: "alexxx"
  - name: GRAPH_SCHEMA
    value: "era_research"
  # PAT with workspace permissions for Genie API (user's own token).
  # Create one at Settings > Developer > Access Tokens, paste value here.
  - name: GENIE_PAT
    value: ""  # <-- PASTE YOUR PAT HERE
  # Embedded Genie space (Dashboard tab). Provide an id or an explicit URL.
  - name: GENIE_SPACE_ID
    value: "01f19d736c9e117a9aacc03fd1e7839d"
  - name: GENIE_EMBED_URL
    value: "https://dbc-3aa503a9-4fa8.cloud.databricks.com/genie/rooms/01f19d736c9e117a9aacc03fd1e7839d"
  # Embedded AI/BI dashboard (Dashboard tab).
  - name: AIBI_DASHBOARD_ID
    value: "01f1a272be991a68b4b19433b856c87b"
  - name: AIBI_EMBED_URL
    value: "https://dbc-3aa503a9-4fa8.cloud.databricks.com/embed/dashboardsv3/01f1a272be991a68b4b19433b856c87b?publish=true"

resources:
  - name: serving-endpoint
    serving_endpoint:
      name: era-supervisor
      permission: CAN_QUERY
  - name: sub-agent-1
    serving_endpoint:
      name: ka-02039b11-endpoint
      permission: CAN_QUERY
  - name: database
    database:
      instance_name: agent-bricks-lakebase-workshop
      database_name: databricks_postgres
      permission: CAN_CONNECT_AND_CREATE
  - name: mas-fallback
    serving_endpoint:
      name: mas-bd9c0651-endpoint
      permission: CAN_QUERY
  - name: genie-space
    genie_space:
      space_id: 01f19d736c9e117a9aacc03fd1e7839d
      permission: CAN_RUN
  - name: genie-warehouse
    sql_warehouse:
      name: "[dev alex_barreto] era-research-wh"
      permission: CAN_USE
