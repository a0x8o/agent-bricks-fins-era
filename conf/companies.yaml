# ---------------------------------------------------------------------------
# The company universe this demo covers.
#
# One entry per organisation. Everything downstream reads this file and nothing
# else: the EDGAR fetcher (resources/fetch_filings.py) decides what to download,
# the synthetic generator (resources/generate_synthetic_docs.py) decides what to
# write, the ticker loader decides what to price, and 05b builds the graph from
# it. Add an organisation here and the whole pipeline picks it up.
#
# THE `source` FIELD IS THE IMPORTANT ONE
# --------------------------------------
#   edgar     - a real SEC registrant. Filings are downloaded from EDGAR, are
#               public domain, and can be cited as evidence like any real filing.
#   synthetic - NOT a real document. No such filing exists, either because the
#               organisation is private (Ford Direct, Addepar), is a US nonprofit
#               that files no securities reports (UCLA Health, Providence, Summa),
#               reports outside the SEC (Henkel, Munich Re), or has suspended
#               periodic reporting (Nationwide). The generator writes a clearly
#               watermarked document instead.
#
# Every synthetic document is stamped SYNTHETIC in its title, its running header,
# its filename, and the corpus manifest, because this demo's entire claim is that
# an answer can be traced to its evidence. A fabricated filing that reads like a
# real one attributed to a real organisation would quietly break that claim. If
# you make the documents look more realistic, keep the watermarks.
#
# `real_source_note` records what genuinely exists for each synthetic entity, so
# anyone who wants to swap in the real document knows where to look.
# ---------------------------------------------------------------------------

# CIK, registrant name, SIC and ticker below were resolved from EDGAR
# (data.sec.gov/submissions) on 2026-08-10, not typed from memory.

defaults:
  # Forms pulled per registrant. 10-Q adds a quarter of recency for the
  # comparison questions; drop it to halve corpus build time.
  forms: ["10-K", "10-Q"]
  fiscal_year: 2025

